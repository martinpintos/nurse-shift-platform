packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# One version per shared tool across the workspace (see README "Decisions").
catalog:
  typescript: 6.0.3
  "@types/node": ^24.19.2
  zod: 4.6.7
  vitest: ^4.1.12
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1

# Dependency build scripts are opt-in. Allow only what needs them; deny the rest explicitly.
allowBuilds:
  # Downloads the schema engine that `prisma migrate` runs.
  "@prisma/engines": true
  # Only re-validates the platform binary pnpm already installed.
  esbuild: false
  # Preinstall only checks the Node version (engines covers it).
  prisma: false

# Security overrides for transitive dependencies (see README "Decisions").
overrides:
  # @prisma/config 7.10.1 pins effect 3.20.0 (GHSA-7589-6fvf-x4pw, ReDoS); 3.22.1+ is patched.
  effect: 3.22.5
